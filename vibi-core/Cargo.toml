[package]
name = "vibi_core"
version = "0.1.0"
edition = "2021"

[dependencies]
dark-light = "1.1"
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }