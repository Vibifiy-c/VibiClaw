name: Build Vibi AI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Vibi-AI-Linux
          path: dist/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Vibi-AI-deb
          path: dist/*.deb
